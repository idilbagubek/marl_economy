[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "marl_economy"
version = "0.1.0"
description = "Multi-Agent Reinforcement Learning Economy Simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
train = [
    "ray[rllib]>=2.10",
    "torch>=2.0",
    "stable-baselines3>=2.0",
]
viz = [
    "pygame>=2.5",
]

[tool.setuptools.packages.find]
where = ["."]
